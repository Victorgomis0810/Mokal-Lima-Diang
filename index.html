k:{desc:'Imagine un immeuble avec un seul portier à l’entrée. Les gens ne parlent qu’au portier. L’accueil, les coffres et le tableau d’affichage n’ont aucune porte sur la rue : même un voleur ne peut pas les atteindre sans passer devant le portier.',kv:[['Seule porte sur la rue','Nginx (le portier)'],['À l’intérieur','Daphne, PostgreSQL, Redis'],['Comment ?','Ils n’écoutent qu’en local'],['Résultat','Moins de portes à surveiller']],atk:'Le voleur ne voit que le portier, qui est costaud. L’accueil et les coffres sont invisibles depuis la rue.',e:['Tu sonnes à la porte de l’immeuble (port 443, HTTPS) : tu veux la liste de tes réunions.','Le portier te montre sa carte d’identité (le certificat) : c’est bien le bon immeuble, et vos échanges deviennent secrets.','Ta demande commence par /api/ : le portier la porte lui-même jusqu’à l’accueil (Daphne). Toi, tu restes dehors.','L’accueil descend au sous-sol demander la liste au coffre (PostgreSQL), avec une question bien rangée.','Le coffre remet la liste à l’accueil.','L’accueil rend la liste au portier.','Le portier te la remet dans une enveloppe scellée.','Pour prévenir les autres participants en direct, l’accueil écrit sur le tableau d’affichage (Redis).','Un curieux essaie d’aller directement à l’accueil sans passer par le portier : il n’y a pas de porte côté rue. Rien ne répond.']}},

k:{desc:'Un ticket de manège valable 15 minutes, plus une carte d’abonnement valable 1 jour. Tu montres le ticket à chaque tour. Quand il expire, la carte t’en donne un nouveau, sans que tu doives redonner ton mot de passe.',kv:[['Le ticket','Valable 15 minutes'],['La carte','Valable 1 jour'],['Pourquoi 2 ?','Si on vole le ticket, il meurt vite'],['La rotation','La carte change à chaque fois']],atk:'Un pirate qui copie ton ticket n’a que 15 minutes. Et comme ta carte est changée à chaque renouvellement, l’ancienne ne marche plus.',e:['Tu donnes ton pseudo et ton mot de passe.','Le serveur te remet 2 papiers : un ticket de 15 minutes (access) et une carte d’abonnement de 1 jour (refresh).','Pour chaque demande, tu montres le ticket de 15 minutes, jamais ton mot de passe.','Le ticket est bon : le serveur répond.','Un pirate a copié ton ticket. Seize minutes plus tard, il essaie de s’en servir.','Le ticket a expiré : refusé. Le pirate n’a eu qu’une toute petite fenêtre.','Toi, tu présentes ta carte d’abonnement pour avoir un nouveau ticket, sans retaper ton mot de passe.','Le serveur te donne un nouveau ticket et change aussi ta carte (rotation) : l’ancienne ne marche plus.']}},

{desc:'Imagine une salle de jeux : à l’entrée on te donne un bracelet numéroté, et le gardien note ton numéro dans son cahier. Chaque fois que tu montres le bracelet, il sait qui tu es.',kv:[['Qui se souvient de toi ?','Le serveur (son cahier)'],['Ton bracelet','Un cookie avec un numéro'],['Pour sortir','Le serveur raye ton numéro'],['Point faible','Un voleur de bracelet']],atk:'Un voleur copie ton bracelet et entre à ta place. Parades : un bracelet que les scripts ne peuvent pas lire (HttpOnly), qui ne voyage que sur une route sécurisée (Secure), et un nouveau numéro après chaque connexion.',e:['Tu écris ton pseudo et ton mot de passe et tu les envoies au serveur, comme si tu disais ton nom à l’entrée.','Le serveur vérifie, écrit ton numéro dans son cahier et te donne le bracelet (le cookie). HttpOnly veut dire que personne ne peut le lire avec un script.','À chaque page demandée, ton navigateur montre le bracelet tout seul. Le serveur cherche le numéro dans son cahier.','Tu dis « j’ai fini » : tu demandes à te déconnecter.','Le serveur raye ton numéro du cahier. Le bracelet ne marche plus.']},
{desc:'Au lieu d’un cahier, le serveur te donne un billet de concert avec un tampon impossible à copier. Il ne note rien : il regarde juste si le tampon est vrai et si le billet n’est pas périmé.',kv:[['Qui se souvient ?','Personne : le billet dit tout'],['Ton billet','Un jeton en 3 morceaux'],['Annuler un billet','Difficile'],['Avantage','Rapide, même avec des millions de gens']],atk:'Si on vole ton billet, on peut l’utiliser jusqu’à sa date limite. Parades : des billets qui expirent vite, et un serveur qui refuse les billets sans tampon (le piège « alg:none »).',e:['Tu envoies ton pseudo et ton mot de passe.','Le serveur fabrique ton billet (le jeton) : une partie dit qui tu es, la dernière est le tampon secret (la signature). Les 3 couleurs sont les 3 morceaux.','Tu montres ton billet à chaque demande, dans la case « Authorization ».','Le serveur refait le tampon avec son secret. Si ça correspond, le billet est vrai. Il n’a pas eu besoin de cahier !','Le billet est périmé, comme un yaourt. Le serveur répond 401 : refusé.','Tu as un deuxième papier spécial (le refresh token) pour demander un nouveau billet sans retaper ton mot de passe.','Le serveur te donne un billet tout neuf, valable un court moment.']},
{desc:'Tu veux entrer dans un club, mais au lieu de donner ton mot de passe au club, tu demandes à Google de dire « c’est bien lui ». Google te donne un ticket (le code) que le club échange en cachette contre une preuve.',kv:[['Les 3 acteurs','Toi, le site, Google'],['Ton mot de passe','Reste chez Google'],['Le ticket','Un code à usage unique'],['Le secret','Gardé par le serveur du site']],atk:'Un tricheur peut essayer de te faire utiliser son propre ticket. Parades : le state (un mot magique choisi au départ et vérifié au retour) et une adresse de retour exacte.',e:['Tu cliques sur « Se connecter avec Google ».','Le site te renvoie chez Google avec un mot magique (le state) qu’il retient pour vérifier au retour.','Tu es chez Google : tu t’y connectes et tu acceptes de partager ton e-mail. Le site ne voit jamais ton mot de passe.','Google te renvoie au site avec un ticket à usage unique (le code) et le mot magique.','Le site compare le mot magique : c’est le même ? Alors la demande est bonne.','Le site va voir Google en cachette, sans toi, et échange le ticket contre des preuves. Il montre son mot de passe secret (client_secret).','Google répond « oui, c’est bien lui » et donne les preuves.','Le site te donne son propre bracelet (une session). Tu es connecté !']}];
const ATKK=[
{desc:'Une base de données, c’est un grand classeur, et le site lui pose des questions en phrases. Si tu écris une phrase piégée dans le formulaire, elle se mélange à la question et en change le sens.',kv:[['La cible','Le classeur (base de données)'],['Le piège','Un texte spécial dans un champ'],['Le danger','Entrer sans mot de passe'],['Outils pour tester','OWASP ZAP, sqlmap']],atk:'On sépare toujours la question de ce que tape l’utilisateur (requête paramétrée) : ce qu’il écrit reste du simple texte, jamais un ordre. Et le site n’a que les droits dont il a besoin.',e:['Au lieu de ton vrai nom, tu écris admin\' -- . L’apostrophe ferme le texte et les deux tirets veulent dire « ignore la suite ».','Le serveur colle ton texte dans sa question. Elle devient « donne-moi l’admin » et la partie « vérifie le mot de passe » est ignorée.','Le classeur obéit et sort la fiche de l’admin.','Le site croit que tu es l’admin, sans mot de passe. L’attaque marche !','Défense : le serveur envoie la question avec des trous ($1, $2), puis le texte à part.','Le classeur cherche quelqu’un qui s’appelle exactement « admin\' -- ». Il n’y a personne.','Entrée refusée : l’attaque a échoué.']},
{desc:'Imagine un facteur malhonnête qui ouvre tes lettres, les lit, les referme et les livre. Ni toi ni le site ne voyez rien. Sur un Wi-Fi partagé, un tricheur peut se faire passer pour le routeur.',kv:[['Où ?','Sur le même Wi-Fi'],['Le truc','Se faire passer pour le routeur'],['Le danger','Lire et changer tes messages'],['La parade','HTTPS + HSTS']],atk:'HTTPS met tes messages dans un coffre fermé et vérifie qui est le site grâce à un certificat. HSTS dit au navigateur « n’accepte jamais autre chose que le coffre ».',e:['Le tricheur crie dans le réseau « le routeur, c’est moi ! » et ton ordinateur le croit.','Sans HTTPS, ton message est une carte postale : le tricheur lit ton pseudo et ton mot de passe.','Il envoie le message au vrai site pour que tu ne remarques rien.','Le site répond avec ton bracelet (cookie) : le tricheur le lit aussi.','Il te rend la réponse. Tout semble normal, mais il a tout vu.','Cette fois tu utilises HTTPS : ton navigateur demande un coffre sécurisé au site.','Le tricheur montre un faux certificat, c’est-à-dire une fausse carte d’identité. Ton navigateur voit que c’est faux et bloque.']},
{desc:'Imagine un mur d’affichage où tout le monde peut coller un mot. Si un malin colle un papier qui dit « fais ceci à celui qui lit », tous les passants obéissent. Un script caché dans un commentaire s’exécute chez chaque visiteur.',kv:[['La cible','Tous les visiteurs'],['Le piège','Un commentaire avec un script'],['Le danger','Voler ta session'],['La parade','Échapper, CSP, HttpOnly']],atk:'Le site transforme les caractères dangereux en texte inoffensif (l’échappement), une règle CSP interdit les scripts non prévus, et HttpOnly cache le bracelet aux scripts.',e:['Le malin écrit un commentaire qui contient un petit programme caché.','Une victime ouvre l’article.','Le site affiche le commentaire sans le vérifier : le programme se retrouve dans la page.','Le navigateur de la victime exécute le programme, qui envoie son bracelet (cookie) au malin.','Le malin montre le bracelet volé au site et se fait passer pour la victime.','Défense : le commentaire est affiché comme du simple texte, et la règle CSP interdit les programmes inconnus.']},
{desc:'Un cadenas à 4 chiffres : on peut essayer 0000, 0001, 0002… jusqu’à trouver. Un robot fait pareil avec des mots de passe, très vite. Un gardien (Wazuh) compte les essais ratés et bloque le robot.',kv:[['La vitesse','40 essais en 10 s'],['Le gardien','Wazuh (règle 5763)'],['La riposte','Bloquer l’adresse du robot'],['Cousin','Fail2Ban']],atk:'On limite le nombre d’essais, on bloque automatiquement l’adresse qui rate trop, et on demande une 2e preuve (code SMS ou application).',e:['Un robot envoie 40 mots de passe différents en 10 secondes.','Tous sont faux : le site répond « non » 40 fois et garde une trace.','Ces traces partent vers le gardien Wazuh.','Wazuh voit trop d’échecs et lance l’alarme (règle 5763).','Réponse automatique : Wazuh ferme la porte à ce robot pendant 10 minutes, comme le fait Fail2Ban.','Le robot réessaie.','Le site répond 429 : « trop de demandes, calme-toi ».']},
{desc:'Tu es sur le site de ta banque et ton bracelet est à ton poignet. Un site piégé cache un formulaire qui envoie un ordre à ta banque. Ton navigateur montre le bracelet tout seul : la banque croit que c’est toi.',kv:[['La cible','Toi, déjà connecté'],['Le piège','Un formulaire caché'],['Le danger','Une action non voulue'],['La parade','Jeton CSRF + SameSite']],atk:'Chaque vrai formulaire du site contient un jeton secret que le site piégé ne peut pas deviner (jeton CSRF). Et SameSite empêche d’envoyer le bracelet depuis un autre site.',e:['Tu visites un site « promo gratuite » tout en restant connecté à ta banque.','La page contient un formulaire invisible qui s’envoie tout seul vers ta banque.','Ton navigateur ajoute ton bracelet automatiquement.','La banque croit que c’est toi et fait le virement. Sans défense, ça marche.','Avec les défenses : le bracelet n’est pas envoyé depuis un autre site et le jeton secret manque.','La banque répond 403 : « il manque le jeton, refusé ».']}];
const MLK=[
{desc:'Des points : plus un enfant est grand, plus il pèse. On cherche la droite qui passe au plus près de tous les points. On part d’une mauvaise droite et on la corrige à chaque tour, comme on règle une douche : trop chaud, trop froid, juste bien. Clique sur le graphique pour ajouter un point.',kv:[['Ce qu’on cherche','Une droite'],['Les traits rouges','Les erreurs'],['Le score','MSE : plus petit = mieux'],['Taille des pas','0,5']],trap:'Un seul point très bizarre peut tirer la droite vers lui. Et deux choses qui vont ensemble ne se causent pas forcément (les glaces et les coups de soleil).',say:'Les traits rouges sont les erreurs. À chaque clic la droite se rapproche des points et l’erreur (MSE) baisse. R² proche de 1 veut dire très bon.'},
{desc:'Des billes de 3 couleurs mélangées. On pose 3 aimants au hasard (les losanges). Chaque bille va vers l’aimant le plus proche, puis chaque aimant se place au milieu de ses billes. On recommence jusqu’à ce que plus rien ne bouge.',kv:[['Sans réponse','Il trouve les groupes tout seul'],['Groupes','3'],['Score','Inertie : distance totale aux aimants'],['Départ','Aimants posés au hasard']],trap:'Si les aimants sont mal posés au départ, le résultat peut être moins bon : clique sur « Nouveau tirage ». Et il faut choisir le nombre de groupes à l’avance.',say:'Un tour a 2 temps : les points choisissent leur aimant (affectation), puis l’aimant va au centre de son groupe (mise à jour). Quand 0 point change, c’est fini.'},
{desc:'Dans une classe de 68 élèves, seuls 8 sont malades. Un détecteur qui dit toujours « personne n’est malade » a presque toujours raison, mais ne trouve aucun malade ! On essaie 4 astuces pour que l’ordinateur apprenne aussi les cas rares. Le vrai test est le rappel : combien de malades a-t-il retrouvés ?',kv:[['Les rares','En rouge'],['Le test','170 nouveaux points'],['Le juge','Ses 5 plus proches voisins'],['Astuces','4']],trap:'On ne rééquilibre jamais avant de séparer entraînement et test : ce serait corriger un examen en ayant déjà vu les réponses.',say:'Exactitude = % de bonnes réponses (facile à avoir). Rappel = % des cas rares retrouvés (le vrai test). SMOTE invente de nouveaux points rouges entre les vrais.'},
{desc:'Au lieu d’un nombre, on répond par oui ou non (violet ou rouge). On trace une ligne : violet d’un côté, rouge de l’autre. On la fait pivoter peu à peu pour faire moins d’erreurs. Les points cerclés sont du mauvais côté.',kv:[['Réponse','Oui ou non (une probabilité)'],['La ligne','Frontière de décision'],['Le score','Log-loss : plus petit = mieux'],['Taille des pas','3']],trap:'Quand les groupes se mélangent, on ne peut pas tout réussir : 100 % est impossible, et ce n’est pas grave.',say:'À chaque clic la ligne pivote et moins de points sont cerclés. La log-loss mesure à quel point il est sûr de lui quand il se trompe.'},
{desc:'C’est le jeu des 20 questions : « x est plus petit que 0,5 ? ». Chaque réponse partage les points en deux paquets. À chaque clic, l’arbre pose la question qui rend les paquets les plus « purs » (une seule couleur). Danger : il finit par apprendre même les erreurs !',kv:[['Comment','Une suite de questions'],['Le juge','Gini : 0 = paquet pur'],['Le test','200 points sans erreur'],['Erreurs cachées','4 mauvaises étiquettes']],trap:'Un arbre qui apprend tout par cœur, même les erreurs, rate les nouveaux exemples : c’est le surapprentissage. Solution : demander l’avis de beaucoup d’arbres, c’est la Random Forest.',say:'Train = réussite sur ce qu’il a appris, Test = sur des exemples nouveaux. Quand Train monte à 100 % mais pas Test, l’arbre triche en apprenant par cœur.'}];
AUT.forEach((c,i)=>{if(AUTK[i])c.k=AUTK[i]});ATK.forEach((c,i)=>{if(ATKK[i])c.k=ATKK[i]});ML.forEach((m,i)=>{m.k=MLK[i]});

[AUT,ATK,SEC].forEach(L=>L.forEach(c=>{(TIT[c.name]||[]).forEach((t,i)=>{if(c.steps[i])c.steps[i][6]=t})}));
const LISTS=()=>[AUT,ATK,ML,SEC][S.tab],LISTS_AT=i=>[AUT,ATK,ML,SEC][i];
/* ---------- Contrôles ---------- */
function mode(){const m=$('#mode');m.textContent=S.night?'☀':'☾';m.setAttribute('aria-label',S.night?'Passer en mode jour':'Passer en mode nuit');$('meta[name="theme-color"]').setAttribute('content',S.night?'#0b0c0e':'#ffffff')}
function theme(){S.night=!S.night;document.documentElement.setAttribute('data-theme',S.night?'nuit':'jour');mode()}
function ctl(){$('#play').innerHTML=`<button class="go" onclick="tog()">${S.play?'⏸ Pause':'▶ Lecture'}</button>`;$('#ctl').innerHTML='<button onclick="adv()">Avancer</button><button onclick="rst()">Réinitialiser</button>'+(S.tab==2&&S.i[2]==1?'<button onclick="ML[1].seed++;rst()">Nouveau tirage</button>':'')+`<button onclick="S.kid=!S.kid;go()">${S.kid?'Mode enfant ✓':'Mode technique'}</button>`}
function go(){$('#tabs').innerHTML=TABS.map((t,i)=>`<a class="${i==S.tab?'on':''}" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="tab(${i})">${t} <small>${LISTS_AT(i).length}</small></a>`).join('');S.tab!=2?flowView():mlView();ctl()}
function stop(){S.play=false;clearTimeout(S.t)}
function tab(i){stop();S.tab=i;S.sel=-1;S.n=0;go()}
function pick(i){stop();S.i[S.tab]=i;S.n=0;S.sel=-1;go()}
function rst(){stop();S.sel=-1;S.n=0;if(S.tab==2)ML[S.i[2]].init();go()}
function loop(){clearTimeout(S.t);if(S.play)S.t=setTimeout(()=>{adv();loop()},S.tab!=2?2600:1400)}
function tog(){S.play=!S.play;loop();ctl()}
function adv(){let ok;if(S.tab!=2){ok=S.n<cur().steps.length;if(ok){S.n++;S.sel=S.n-1}}else{const m=ML[S.i[2]];ok=!m.end;if(ok){m.step();S.sel=m.rows.length-1}}
if(!ok)S.play=false;go();if(ok&&S.tab!=2){const s=cur().steps[S.n-1];fly(s[0],s[1],NM[s[0]].c)}}
$('#svg').onclick=e=>{if(S.tab!=2||S.i[2]!=0)return;const r=$('#svg').getBoundingClientRect(),x=((e.clientX-r.left)/r.width*600-40)/540,y=(330-(e.clientY-r.top)/r.height*360)/310;
if(x>=0&&x<=1&&y>=0&&y<=1){ML[0].p.push([x,y]);ML[0].log(' (+1 point)');S.sel=-1;go()}};
ML.forEach(m=>m.init());mode();go();
</script></body></html>
